[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfsense"
version = "0.1.0"
description = "Single-camera shelf attention research pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vision = ["ultralytics>=8.3,<9", "opencv-python>=4.10,<5", "lap>=0.5.12,<0.6"]
gaze = ["torch>=2.2,<3", "l2cs @ git+https://github.com/Ahmednull/L2CS-Net.git@main"]

[project.scripts]
shelfsense = "shelfsense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
