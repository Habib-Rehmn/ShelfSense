name: shelfsense

x-app: &app
  build: .
  image: shelfsense:local
  environment: &database-environment
    SHELFSENSE_DATABASE_URL: postgresql://shelfsense@db:5432/shelfsense
    PGPASSWORD: ${SHELFSENSE_POSTGRES_PASSWORD:?Set SHELFSENSE_POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: shelfsense
      POSTGRES_USER: shelfsense
      POSTGRES_PASSWORD: ${SHELFSENSE_POSTGRES_PASSWORD:?Set SHELFSENSE_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfsense -d shelfsense"]
      interval: 5s
      timeout: 5s
      retries: 20

  init:
    <<: *app
    command: ["python", "-m", "shelfsense", "init-db"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 20

  dashboard:
    <<: *app
    environment:
      SHELFSENSE_API_URL: http://api:8000
    command: ["streamlit", "run", "dashboard/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 20

  cli:
    <<: *app
    profiles: ["tools"]
    command: ["python", "-m", "shelfsense", "--help"]
    volumes:
      - ./outputs:/imports:ro
      - ./configs:/app/configs:ro
      - ./data:/data:ro
      - artifacts:/app/outputs
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  artifacts:
